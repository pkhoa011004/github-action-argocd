# Application này tạo namespace demo trước các workload khác.
# Sync wave -1 giúp namespace tồn tại trước khi backend/frontend/api được apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-namespace
  namespace: argocd
  annotations:
    # Chạy sớm nhất trong nhóm app-of-apps.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    # Dùng manifest namespace trong repo hiện tại.
    repoURL: https://github.com/pkhoa011004/github-action-argocd.git
    targetRevision: main
    path: k8s/base
  destination:
    # Namespace là tài nguyên cluster-scoped, nhưng Application vẫn được quản lý từ argocd.
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Giữ cluster khớp với Git.
      prune: true
      selfHeal: true
