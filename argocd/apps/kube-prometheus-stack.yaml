apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 61.7.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        fullnameOverride: kube-prometheus-stack

        prometheusOperator:
          admissionWebhooks:
            enabled: false

        prometheus:
          service:
            type: ClusterIP
          prometheusSpec:
            retention: 7d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

        alertmanager:
          enabled: true
          service:
            type: ClusterIP
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: phuockhoamai@gmail.com
              smtp_auth_username: phuockhoamai@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail-auth/smtp-password
              smtp_require_tls: true
            inhibit_rules:
              - source_matchers:
                  - 'severity = critical'
                target_matchers:
                  - 'severity =~ warning|info'
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - 'severity = warning'
                target_matchers:
                  - 'severity = info'
                equal:
                  - namespace
                  - alertname
            route:
              receiver: gmail
              group_by:
                - namespace
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              - name: gmail
                email_configs:
                  - to: phuockhoamai@gmail.com
                    send_resolved: true
                    headers:
                      subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            templates:
              - /etc/alertmanager/config/*.tmpl
          alertmanagerSpec:
            secrets:
              - alertmanager-gmail-auth

        grafana:
          enabled: true
          service:
            type: ClusterIP
          persistence:
            enabled: false

        kubeStateMetrics:
          enabled: true

        nodeExporter:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
