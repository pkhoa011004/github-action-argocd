# ConfigMap chứa file HTML được mount vào Nginx để làm giao diện frontend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: demo
  annotations:
    # ConfigMap phải có trước Deployment để pod mount được file.
    argocd.argoproj.io/sync-wave: "0"
data:
  # Nội dung trang web tĩnh. JavaScript gọi /api/ để lấy response từ backend.
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GitOps FE</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            color: #172033;
          }
          main {
            width: min(720px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #d9e2ef;
            border-radius: 8px;
            background: #ffffff;
          }
          h1 {
            margin: 0 0 12px;
            font-size: 32px;
          }
          p {
            line-height: 1.6;
          }
          code {
            padding: 2px 6px;
            border-radius: 4px;
            background: #eef3f8;
          }
          #backend-response {
            margin-top: 20px;
            padding: 16px;
            border-left: 4px solid #0ea5e9;
            background: #eff8ff;
            font-weight: 700;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Frontend is running</h1>
          <p>This page is served by Nginx and calls the backend through <code>/api/</code>.</p>
          <div id="backend-response">Loading backend...</div>
        </main>
        <script>
          fetch("/api/")
            .then((response) => response.text())
            .then((text) => {
              document.getElementById("backend-response").textContent = text.trim();
            })
            .catch((error) => {
              document.getElementById("backend-response").textContent = "Backend error: " + error;
            });
        </script>
      </body>
    </html>
---
# ConfigMap chứa cấu hình Nginx.
# Nginx serve HTML ở / và proxy /api/ sang Service backend trong cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: demo
  annotations:
    # Cấu hình Nginx được tạo trước Deployment.
    argocd.argoproj.io/sync-wave: "0"
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /api/ {
        # DNS service nội bộ Kubernetes của backend.
        proxy_pass http://backend.demo.svc.cluster.local:8080/;
      }
    }
---
# Deployment chạy Nginx frontend và mount hai ConfigMap ở trên.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  annotations:
    # Deployment chạy sau ConfigMap.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Một replica là đủ cho demo frontend.
  replicas: 1
  selector:
    matchLabels:
      # Deployment quản lý pod frontend theo label này.
      app: frontend
  template:
    metadata:
      labels:
        # Label này cũng được Service dùng để chọn pod.
        app: frontend
    spec:
      containers:
        - name: frontend
          # Nginx serve static HTML và làm reverse proxy tới backend.
          image: nginx:1.27
          ports:
            # Nginx lắng nghe HTTP port 80.
            - containerPort: 80
          volumeMounts:
            # Mount index.html từ ConfigMap vào web root.
            - name: frontend-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            # Mount file cấu hình Nginx thay cho default.conf.
            - name: frontend-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        # Volume lấy dữ liệu từ ConfigMap frontend-html.
        - name: frontend-html
          configMap:
            name: frontend-html
        # Volume lấy dữ liệu từ ConfigMap frontend-nginx.
        - name: frontend-nginx
          configMap:
            name: frontend-nginx
---
# Service expose frontend trong cluster.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  annotations:
    # Service được tạo sau Deployment.
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    # Chọn pod frontend bằng label app=frontend.
    app: frontend
  ports:
    # Service port 80 forward vào Nginx container port 80.
    - port: 80
      targetPort: 80
